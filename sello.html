<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <title>Sella tu pasaporte · LOGIA</title>
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/logia.css">
</head>
<body>
<main class="wrap">
  <div id="carga" style="text-align:center;padding:80px 0"><span class="spinner"></span><p class="nota">Sellando tu pasaporte…</p></div>

  <!-- Sellado -->
  <section id="ok" class="oculto" style="text-align:center">
    <p class="kicker" id="okTitulo">PASAPORTE SELLADO</p>
    <div class="sello-grande" id="sello"></div>
    <h2 class="serif titulo" id="okLocal"></h2>
    <p class="lema" id="okTexto" style="margin:12px auto 22px"></p>
    <div class="al-wallet oculto" id="alWallet">
      <p id="alWalletTxt">Abriendo tu pasaporte en el Wallet…</p>
      <a class="btn btn-claro" id="alWalletBtn" href="#">VER MI PASAPORTE EN WALLET</a>
      <button class="enlace-sutil" id="alWalletNo">Quedarme aquí</button>
    </div>
    <div id="tarjeta" style="text-align:left"></div>
  </section>

  <!-- No identificado -->
  <section id="quien" class="oculto">
    <div class="emblema" id="em"></div>
    <p class="kicker">ESTÁS EN</p>
    <h2 class="serif titulo" id="qLocal" style="margin-top:8px"></h2>
    <p class="lema">Sella tu pasaporte de la Ruta Cervecera.</p>
    <a class="btn btn-rojo" id="qUnirme" href="index.html?unirme=1">UNIRME Y RECIBIR MI SELLO</a>
    <button class="btn btn-linea" onclick="document.getElementById('qForm').classList.toggle('oculto')">Ya soy miembro</button>
    <div id="qForm" class="oculto">
      <label for="rm">NÚMERO DE MIEMBRO</label>
      <input id="rm" placeholder="LG-0001" autocapitalize="characters">
      <label for="rc">CÓDIGO DE TU TARJETA</label>
      <input id="rc" maxlength="6" autocapitalize="characters">
      <button class="btn btn-rojo" style="margin-top:20px" id="rb">SELLAR</button>
    </div>
    <p id="err" class="error"></p>
  </section>

  <section id="malo" class="oculto" style="text-align:center;padding-top:60px">
    <h2 class="serif titulo">Código no válido</h2>
    <p class="lema">Escanea de nuevo el código de la Logia en el local.</p>
  </section>
</main>
<script src="assets/qrcode.js"></script>
<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/logia.js"></script>
<script>
  var p = new URLSearchParams(location.search), V = p.get('v'), K = p.get('k');
  document.getElementById('em').innerHTML = LOGIA.emblema();
  function solo(id) { ['carga', 'ok', 'quien', 'malo'].forEach(function (s) { document.getElementById(s).classList.toggle('oculto', s !== id); }); }

  function sellar(id) {
    solo('carga');
    LOGIA.api('sellar', { m: id.m, t: id.t, v: V, k: K }).then(function (r) {
      var c = r.credencial, hechos = c.locales.filter(function (l) { return l.visitado; }).length;
      var primera = r.primera !== undefined ? r.primera : r.nuevo;
      var sello = document.getElementById('sello');
      sello.innerHTML = LOGIA.selloSVG(r.local, String(r.desde || r.fecha).slice(0, 10));
      sello.classList.toggle('repetido', !primera);
      document.getElementById('okTitulo').textContent = primera ? 'PASAPORTE SELLADO' : 'ESTE LUGAR YA ESTÁ EN TU PASAPORTE';
      document.getElementById('okLocal').textContent = r.local;
      var avance = hechos === c.locales.length
        ? '¡Completaste la Ruta Cervecera! Eres Explorador de la Logia.'
        : 'Llevas ' + hechos + ' de ' + c.locales.length + ' sellos en la Ruta Cervecera.';
      document.getElementById('okTexto').textContent = primera ? avance
        : 'Lo sellaste el ' + LOGIA.fechaHora(r.desde) + '. Podrás sellarlo de nuevo desde el ' + LOGIA.fechaHora(r.vence) + '. ' + avance;
      document.getElementById('tarjeta').innerHTML = LOGIA.tarjeta(c);
      LOGIA.activarMapas();
      if (primera && navigator.vibrate) navigator.vibrate(60);
      solo('ok');
      irAlWallet(c);
    }).catch(function (e) {
      if (/credencial/i.test(e.message)) { try { localStorage.removeItem('logia_id'); } catch (x) {} preguntar(); }
      else solo('malo');
    });
  }

  // Después de sellar:
  // - si el pase ya está en el Wallet de este teléfono, abre el Wallet solo (con opción de quedarse);
  // - si no está, muestra el botón para agregarlo y no redirige a ninguna parte.
  var temporizador = null;
  function irAlWallet(c) {
    var url = LOGIA.enlaceWallet(c);
    if (!url) return;
    var caja = document.getElementById('alWallet'), txt = document.getElementById('alWalletTxt'),
        btn = document.getElementById('alWalletBtn'), no = document.getElementById('alWalletNo');
    caja.classList.remove('oculto');

    if (LOGIA.tieneWallet(c)) {
      btn.textContent = 'ABRIR MI WALLET';
      btn.href = '#';
      btn.onclick = function (e) { e.preventDefault(); clearInterval(temporizador); LOGIA.abrirWallet(c); };
      var s = 2;
      txt.textContent = 'Abriendo tu Wallet en ' + s + '…';
      temporizador = setInterval(function () {
        s--;
        if (s <= 0) { clearInterval(temporizador); txt.textContent = 'Tu pasaporte está actualizado en tu Wallet.'; no.remove(); LOGIA.abrirWallet(c); }
        else txt.textContent = 'Abriendo tu Wallet en ' + s + '…';
      }, 1000);
      no.textContent = 'Quedarme aquí';
      no.onclick = function () { clearInterval(temporizador); txt.textContent = 'Tu pasaporte está actualizado en tu Wallet.'; this.remove(); };
      return;
    }

    txt.textContent = 'Guarda tu pasaporte en el Wallet para tenerlo siempre a mano.';
    btn.textContent = LOGIA.esIOS() ? 'AGREGAR A APPLE WALLET' : 'AGREGAR A GOOGLE WALLET';
    btn.href = url;
    btn.onclick = function () { LOGIA.marcarWallet(c); };
    no.textContent = 'Ya lo tengo en mi Wallet';
    no.onclick = function () { LOGIA.marcarWallet(c); this.remove(); txt.textContent = 'Listo. La próxima vez abriremos tu Wallet directamente.'; btn.textContent = 'ABRIR MI WALLET'; btn.href = '#'; btn.onclick = function (e) { e.preventDefault(); LOGIA.abrirWallet(c); }; };
  }

  function preguntar() {
    LOGIA.api('local', { v: V, k: K }).then(function (l) {
      document.getElementById('qLocal').textContent = l.nombre;
      try { localStorage.setItem('logia_pendiente', JSON.stringify({ v: V, k: K })); } catch (e) {}
      solo('quien');
    }).catch(function () { solo('malo'); });
  }

  document.getElementById('rb').onclick = function () {
    var err = document.getElementById('err'); err.textContent = '';
    LOGIA.api('recuperar', { m: document.getElementById('rm').value, codigo: document.getElementById('rc').value })
      .then(function (r) { LOGIA.guardar(r.m, r.t); try { localStorage.removeItem('logia_pendiente'); } catch (e) {} sellar(r); })
      .catch(function (e) { err.textContent = e.message; });
  };

  if (!V || !K) solo('malo');
  else { var id = LOGIA.identidad(); if (id) sellar(id); else preguntar(); }
</script>
</body>
</html>
